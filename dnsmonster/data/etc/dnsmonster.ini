[capture]
devname = eth0
port = 53

[general]
skipdomainsfile = /etc/dnsmonster/skipdomains.csv
skipdomainsrefreshinterval = 1m

[file_output]
fileoutputtype = 2
fileoutputpath = /var/log/dnsmonster/
fileoutputformat = json
fileoutputgotemplate = {{.}}
fileoutputrotatecron = 0 0 * * *
fileoutputrotatecount = 7


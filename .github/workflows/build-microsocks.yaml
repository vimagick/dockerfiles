name: Build MicroSocks

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - microsocks/Dockerfile
      - .github/workflows/build-microsocks.yaml

env:
  GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker Build and Notify
        uses: ./.github/actions/docker-build-notify
        with:
          context: 'microsocks'
          image_name: 'easypi/microsocks'
          version_arg: 'MICROSOCKS_VERSION'
          version_value: '1.0.5'

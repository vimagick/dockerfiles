version 2.0

config setup
    nat_traversal=yes
    virtual_private=%v4:10.0.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0.0/12,%v4:!192.168.42.0/24
    protostack=netkey

conn vpnpsk
    connaddrfamily=ipv4
    auto=add
    left=%defaultroute
    leftid=%fromcert
    leftnexthop=%defaultroute
    leftprotoport=17/1701
    rightprotoport=17/%any
    right=%any
    rightsubnetwithin=0.0.0.0/0
    forceencaps=yes
    authby=secret
    pfs=no
    type=transport
    auth=esp
    ike=aes256-sha2_256,aes128-sha2_256,3des-sha1
    phase2alg=aes256-sha2_256,aes128-sha2_256,3des-sha1
    keyexchange=ikev1
    rekey=no
    dpddelay=30
    dpdtimeout=120
    dpdaction=restart

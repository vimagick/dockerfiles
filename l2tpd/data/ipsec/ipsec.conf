version 2.0

config setup
    protostack=netkey
    ikev1-policy=accept

conn vpnpsk
    auto=add
    left=%defaultroute
    leftnexthop=%defaultroute
    leftprotoport=17/1701
    rightprotoport=17/%any
    right=%any
    encapsulation=yes
    authby=secret
    pfs=no
    type=transport
    ike=3des-sha1,aes128-sha1,aes256-sha2_256
    phase2alg=3des-sha1,aes128-sha1,aes256-sha2_256
    keyexchange=ikev1
    rekey=no
    dpddelay=30
    dpdtimeout=120

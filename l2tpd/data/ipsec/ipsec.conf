version 2.0

config setup
    virtual_private=%v4:10.0.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0.0/12,%v4:!192.168.42.0/24
    protostack=netkey
    ikev1-policy=accept

conn vpnpsk
    auto=add
    left=%defaultroute
    leftnexthop=%defaultroute
    leftprotoport=17/1701
    rightprotoport=17/%any
    right=%any
    encapsulation=yes
    authby=secret
    pfs=no
    type=transport
    ike=3des-sha1,aes128-sha1,aes256-sha2_256
    phase2alg=3des-sha1,aes128-sha1,aes256-sha2_256
    keyexchange=ikev1
    rekey=no
    dpddelay=30
    dpdtimeout=120

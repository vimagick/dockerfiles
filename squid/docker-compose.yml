services:
  squid:
    image: easypi/squid
    ports:
      - "3128:3128/tcp"
      - "3130:3130/udp"
    volumes:
      - ./data/etc/squid.conf:/etc/squid/squid.conf:ro
      - ./data/etc/conf.d:/etc/squid/conf.d:ro
      - ./data/var:/var/cache/squid
      - ./data/log:/var/log/squid
    tmpfs:
      - /run
    stop_signal: SIGKILL
    restart: unless-stopped

# https://www.squid-cache.org/Doc/config/ssl_bump/

acl DiscoverSNIHost at_step SslBump1

acl blocked_domains dstdomain "/etc/squid/conf.d/adblock.txt"
acl blocked_domains_ssl ssl::server_name "/etc/squid/conf.d/adblock.txt"

http_access deny blocked_domains

ssl_bump peek DiscoverSNIHost
ssl_bump terminate blocked_domains_ssl
ssl_bump splice all

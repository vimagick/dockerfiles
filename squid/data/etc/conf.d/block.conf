# https://www.squid-cache.org/Doc/config/ssl_bump/

acl DiscoverSNIHost at_step SslBump1

acl blocked_ips dst "/etc/squid/conf.d/blocked-ips.txt"
acl blocked_names dstdomain "/etc/squid/conf.d/blocked-names.txt"
acl blocked_names_ssl ssl::server_name "/etc/squid/conf.d/blocked-names.txt"

http_access deny blocked_ips
http_access deny blocked_names

ssl_bump peek DiscoverSNIHost
ssl_bump terminate blocked_names_ssl
ssl_bump splice all

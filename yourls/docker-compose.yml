x-yourls-image: &yourls-image yourls:1.10-fpm-alpine

services:

  init:
    image: *yourls-image
    volumes:
      - ./data/yourls:/data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$(ls -A /data 2>/dev/null)" ]; then
          echo 'Initializing /data from image...'
          cp -a /var/www/html/. /data/
          chown -R 1000:1000 /data || true
        else
          echo '/data is not empty, skipping initialization.'
        fi

  yourls:
    image: *yourls-image
    environment:
      YOURLS_DB_HOST: mysql
      YOURLS_DB_USER: yourls
      YOURLS_DB_PASS: yourls
      YOURLS_DB_NAME: yourls
      YOURLS_SITE: https://yourls.easypi.duckdns.org
      YOURLS_USER: admin
      YOURLS_PASS: admin
    volumes:
      - ./data/yourls:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8080:80"
    volumes:
      - ./data/yourls:/var/www/html:ro
      - ./data/nginx:/etc/nginx/conf.d:ro
    depends_on:
      yourls:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yourls
      MYSQL_USER: yourls
      MYSQL_PASSWORD: yourls
    volumes:
      - ./data/mysql:/var/lib/mysql
    restart: unless-stopped

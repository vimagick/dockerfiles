log:
  access: /var/log/v2ray/access.log
  error: /var/log/v2ray/error.log
  loglevel: warning

inbounds:
  # https://deepwiki.com/v2ray/v2ray-core/3.1-vmess-protocol
  - port: 6443
    protocol: vmess
    settings:
      clients:
        - id: ca139f45-2879-42d6-a651-f290f8d373cc
          level: 0
          alterId: 4
          email: alice@example.com

  # https://deepwiki.com/v2ray/v2ray-core/3.2-vless-protocol
  - port: 8443
    protocol: vless
    settings:
      clients:
        - id: ca139f45-2879-42d6-a651-f290f8d373cc
          flow: xtls-rprx-direct
          level: 0
          email: alice@example.com
      decryption: none
    streamSettings:
      network: tcp
      security: xtls
      xtlsSettings:
        alpn:
          - http/1.1
          - h2
      certificates:
        - certificateFile: /etc/letsencrypt/live/example.com/fullchain.pem
          keyFile: /etc/letsencrypt/live/example.com/privkey.pem

  # https://www.v2ray.com/chapter_02/protocols/shadowsocks.html
  - port: 8388
    protocol: shadowsocks
    settings:
      method: chacha20-ietf-poly1305
      password: uCahsh5pohfi
      network: tcp,udp
      level: 0
      email: alice@example.com

# https://www.v2ray.com/chapter_02/02_protocols.html
outbounds:
  - tag: direct
    protocol: freedom
    settings: {}

  - tag: blocked
    protocol: blackhole
    settings: {}

  - tag: proxy-us
    protocol: socks
    settings:
      servers:
        - address: upstream-proxy-us
          port: 1080

  - tag: proxy-jp
    protocol: socks
    settings:
      servers:
        - address: upstream-proxy-jp
          port: 1080

# https://www.v2ray.com/chapter_02/03_routing.html
routing:
  domainStrategy: AsIs

  balancers:
    - tag: balancer
      selector: ["proxy-"]
      strategy:
        type: random

  rules:
    - type: field
      ip:
        - geoip:private
      outboundTag: blocked

    - type: field
      domain:
        - geosite:tiktok
        - geosite:instagram
        - geosite:facebook
        - geosite:twitter
        - geosite:reddit
      outboundTag: blocked

    - type: field
      geoip:
        - cn
      outboundTag: direct

    - type: field
      domain:
        - geosite:cn
      outboundTag: direct

    - type: field
      balancerTag: balancer

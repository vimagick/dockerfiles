log:
  access: /var/log/v2ray/access.log
  error: /var/log/v2ray/error.log
  loglevel: warning

inbounds:
  # https://deepwiki.com/v2ray/v2ray-core/3.1-vmess-protocol
  - port: 6443
    protocol: vmess
    settings:
      clients:
        - id: f97fdba2-603d-4f80-bc77-451662913e1a
          level: 0
          alterId: 4
          email: alice@example.com
  # https://deepwiki.com/v2ray/v2ray-core/3.2-vless-protocol
  - port: 8443
    protocol: vless
    settings:
      clients:
        - id: 87b77f82-d36b-11f1-a345-a785a0b51903
          flow: xtls-rprx-direct
          level: 0
          email: alice@example.com
      decryption: none
    streamSettings:
      network: tcp
      security: xtls
      xtlsSettings:
        alpn:
          - http/1.1
          - h2
      certificates:
        - certificateFile: /etc/letsencrypt/live/example.com/fullchain.pem
          keyFile: /etc/letsencrypt/live/example.com/privkey.pem
  # https://www.v2ray.com/chapter_02/protocols/shadowsocks.html
  - port: 8388
    protocol: shadowsocks
    settings:
      method: chacha20-ietf-poly1305
      password: au9WaeShohph
      network: tcp,udp
      level: 0
      email: alice@example.com

outbounds:
  - protocol: freedom
    settings: {}
  - protocol: blackhole
    settings: {}
    tag: blocked
# - protocol: socks
#   settings:
#     servers:
#       - address: 127.0.0.1
#         port: 1080
#   tag: proxy

routing:
  domainStrategy: AsIs
  rules:
    - type: field
      ip:
        - geoip:private
      outboundTag: blocked
